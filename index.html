<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f5ef"><title>솜하우스</title><link rel="stylesheet" href="style.css?v=shared-20261102-2"></head><body><header><div><span class="logo">✿</span> <strong>솜하우스</strong><small>우리 가족의 작은 기록</small></div></header><main><nav aria-label="메뉴"><button data-page="home">홈</button><button data-page="records">육아 기록</button><button data-page="schedule">일정</button><button data-page="shopping">구매 목록</button><button data-page="ai">AI 대화</button></nav><section id="connection" class="card connection" aria-label="가족 공유 설정">
<div class="heading"><h2 id="connection-title">가족 공유 로그인</h2><button id="connection-toggle" class="secondary" aria-expanded="true" aria-controls="connection-details">가족 공유 설정</button></div>
<p id="connection-status" role="status" aria-live="polite">로그인하면 두 휴대폰에서 같은 기록을 사용해요. 이 기기의 기존 기록은 그대로 남아요.</p>
<div id="connection-details">
<form id="login-form"><details><summary>서버 주소 설정</summary><label class="field">맥미니 서버 주소<input id="server-url" type="url" required placeholder="https://맥미니주소.ts.net" autocomplete="url"></label></details><label class="field">아이디<input name="username" autocomplete="username" required maxlength="100"></label><label class="field">비밀번호<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button type="submit">로그인</button><p class="caption">가족 계정으로 로그인하면 맥미니에 저장한 같은 기록을 사용해요. 이 기기의 기존 기록은 그대로 남아요.</p></form>
<div id="shared-controls" hidden><div class="quick"><button id="refresh-shared" class="secondary">공유 기록 새로고침</button><button id="migrate-local" class="secondary">이 기기 기록을 공유로 옮기기</button><button id="export-device" class="secondary">이 기기 원본 백업</button><button id="logout" class="plain">로그아웃</button></div><p id="migration-help" class="caption">로그인 후 입력한 기록은 자동으로 공유 저장돼요. 별도로 옮길 필요는 없습니다.</p></div>
</div></section><div id="content"></div><aside><strong id="storage-title">우리 기기에만 저장돼요</strong><p id="storage-description">기록은 이 기기와 브라우저에 보관돼요. 가족 공유에 로그인하기 전에는 다른 기기와 공유되지 않아요. JSON 내보내기로 백업할 수 있어요.</p><button id="export" class="secondary">JSON 내보내기</button> <label class="button secondary">JSON 가져오기<input id="import" type="file" accept="application/json,.json" hidden></label></aside></main><dialog id="dialog"><form id="form"><div class="formhead"><h2 id="formtitle"></h2><button type="button" id="close" class="plain" aria-label="닫기">✕</button></div><div id="fields"></div><div class="actions"><button type="button" id="cancel" class="secondary">취소</button><button type="submit">저장하기</button></div></form></dialog><div id="notice" role="status" aria-live="polite"></div><script src="config.js?v=shared-20261102-2" defer></script><script src="service.js?v=shared-20261102-2" defer></script><script src="shared.js?v=shared-20261102-2" defer></script><script src="app.js?v=shared-20261102-2" defer></script></body></html>
