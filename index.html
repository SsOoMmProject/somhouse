<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f5ef"><title>솜하우스</title><link rel="stylesheet" href="style.css"></head><body><header><div><span class="logo">✿</span> <strong>솜하우스</strong><small>우리 가족의 작은 기록</small></div></header><main><nav aria-label="메뉴"><button data-page="home">홈</button><button data-page="records">육아 기록</button><button data-page="schedule">일정</button><button data-page="shopping">구매 목록</button><button data-page="ai">AI 대화</button></nav><div id="content"></div><aside><strong>우리 기기에만 저장돼요</strong><p>기록은 이 기기와 브라우저에만 보관되어 다른 기기나 배우자와 자동 공유되지 않아요. 브라우저 데이터를 삭제하면 사라질 수 있으니 정기적으로 백업해 주세요.</p><button id="export" class="secondary">JSON 내보내기</button> <label class="button secondary">JSON 가져오기<input id="import" type="file" accept="application/json,.json" hidden></label></aside></main><dialog id="dialog"><form id="form"><div class="formhead"><h2 id="formtitle"></h2><button type="button" id="close" class="plain" aria-label="닫기">✕</button></div><div id="fields"></div><div class="actions"><button type="button" id="cancel" class="secondary">취소</button><button type="submit">저장하기</button></div></form></dialog><script src="app.js" defer></script></body></html>
